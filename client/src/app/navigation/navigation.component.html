<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item href="/profile">Profile</a>
      <a mat-list-item href="/home">Home</a>
      <a mat-list-item href="/loggedIn">Privat <mat-icon fontIcon="lock" color="warn"></mat-icon></a>
      <p class="footer">
        <button mat-raised-button (click)="loginService.logout()" *ngIf="loginService.isLoggedIn() | async; else loginButton">Logout</button>
      </p>
      <ng-template #loginButton>
        <button mat-raised-button (click)="loginService.login()">Login</button>
      </ng-template>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>client</span>
    </mat-toolbar>
    <!-- Add Content Here -->
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
