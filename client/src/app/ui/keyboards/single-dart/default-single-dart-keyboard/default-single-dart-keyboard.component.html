<div class="keyboard">
  <div mat-flat-button class="key" *ngFor="let n of numbers">{{n}}</div>
  <div class="back key special">
    <mat-icon class="back-icon">backspace</mat-icon>
  </div>
  <div class="key special zero">0</div>
  <div class="key special twenty-five">25</div>
  <div class="key special fifty">50</div>
  <div class="bottom">
    <div class="key">Double</div>
    <div class="key">Triple</div>
  </div>
</div>
